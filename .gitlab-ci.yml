# Tests on every supported Python, lint, and a packaging smoke test.
# Tests never touch the network (HTTP is faked), so this is fast and deterministic.

stages: [test, build, deploy]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths: [.cache/pip]

.py_job: &py_job
  before_script:
    - python --version
    - pip install -e ".[surface,lidar,models,nasa,dev]"

lint:
  <<: *py_job
  stage: test
  image: python:3.13
  script:
    - ruff check atmoz tests

test:
  <<: *py_job
  stage: test
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  script:
    - pytest --cov=atmoz --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'

core-install:
  # The core install (no extras) must import and run the surface downloaders.
  stage: test
  image: python:3.11
  script:
    - pip install -e ".[dev]"
    - pytest tests/test_package.py tests/test_aqs.py tests/test_airnow.py tests/test_cache.py tests/test_credentials.py tests/test_urls.py tests/test_units.py tests/test_ucn.py tests/test_mda8.py tests/test_dataclasses.py tests/test_collocation.py tests/test_sonde.py tests/test_stats.py

wheel:
  stage: build
  image: python:3.13
  script:
    - pip install build
    - python -m build
    - python tools/check_wheel.py
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# Documentation: built on every pipeline (strict, so broken links fail), published to GitLab Pages from main only.
docs-check:
  stage: build
  image: python:3.13
  script:
    - pip install -e ".[dev]"
    - mkdocs build --strict -d site
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  image: python:3.13
  script:
    - pip install -e ".[dev]"
    - mkdocs build --strict -d public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
